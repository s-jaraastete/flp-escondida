# Despliegue oficial a GitHub Pages: SOLO desde la rama main (versión aprobada).
name: Deploy GitHub Pages (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (base = /<repositorio>/)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Rutas limpias (sin "#"): GitHub Pages no tiene reescrituras, así que 404.html sirve la app
      # y React Router resuelve la ruta (/web, /app/visitas…).
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
